<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CORGI-EDITOR</title>
    <script>
      // UI preview in the browser (no Electron): if the preload did NOT inject
      // window.api, it builds a minimal mock so the screen loads. In production the
      // preload defines window.api before the page, so this block never runs.
      if (!window.api) {
        const defaults = {
          threshold: '-30', margin: '0.5', output_folder: '', output_format: 'mp4',
          output_resolution: 'original', subtitles: 'false', subtitle_model: 'tiny',
          subtitle_position: 'bottom', subtitle_style: 'hormozi', green_screen: 'false',
          burn_subtitles: 'true', words_per_line: '4', lines_count: '2',
          subtitle_configs: '{}', subtitle_position_mode: 'fixed',
          subtitle_position_percent: '80', subtitle_persistence: '1',
          smart_subtitle: 'false', auto_line_wrap: 'false', language: 'en', theme: 'modern', subtitle_language: 'auto',
        };
        window.api = new Proxy({}, {
          get(_, prop) {
            if (prop === 'getConfig') return async () => ({ ...defaults });
            if (prop === 'saveConfig') return async () => {};
            if (prop === 'checkModel' || prop === 'pathExists' || prop === 'checkWhisperCli') return async () => false;
            if (typeof prop === 'string' && prop.startsWith('on')) return () => {};
            return async () => undefined;
          },
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
